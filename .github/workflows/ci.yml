name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.4.2' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: bun install
      - name: Commit generated lockfile
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git status --porcelain -- bun.lock | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: add Bun lockfile"
            git push origin "HEAD:${HEAD_REF}"
          fi
      - run: bun run build
      - name: Validate Ankhorage repository
        run: BUN_INSTALL_CACHE_DIR="${RUNNER_TEMP}/doctor-cache" bunx @ankhorage/doctor@0.10.14 validate .
      - run: bun run lint
      - run: bun run format:check
      - run: bun run knip:check
      - run: bun run test
      - run: bun run typecheck
      - if: github.event_name == 'pull_request'
        run: bun run changeset:status
