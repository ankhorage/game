name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.4.2' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: bun install
      - name: Capture generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-bun-lock
          path: bun.lock
          if-no-files-found: error
      - run: bun run build
      - name: Validate Ankhorage repository
        run: BUN_INSTALL_CACHE_DIR="${RUNNER_TEMP}/doctor-cache" bunx @ankhorage/doctor@0.10.14 validate .
      - run: bun run lint
      - run: bun run format:check
      - run: bun run knip:check
      - run: bun run test
      - run: bun run typecheck
      - if: github.event_name == 'pull_request'
        run: bun run changeset:status
